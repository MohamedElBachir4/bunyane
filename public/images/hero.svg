<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Contemporary residential building">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe3e6"/>
      <stop offset="1" stop-color="#f4efe4"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f0e8"/>
      <stop offset="1" stop-color="#e2ddd0"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d6c76"/>
      <stop offset="1" stop-color="#143f48"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9c3b3"/>
      <stop offset="1" stop-color="#b5ae9b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1280" cy="170" r="70" fill="#fff6dc" opacity="0.85"/>
  <path d="M0 640 C 300 590 520 610 800 585 S 1300 600 1600 575 V 900 H 0 Z" fill="#b9cfd0" opacity="0.55"/>
  <!-- background towers -->
  <g fill="#c8d6d6">
    <rect x="80" y="380" width="170" height="320"/>
    <rect x="260" y="450" width="120" height="250"/>
    <rect x="1330" y="400" width="150" height="300"/>
    <rect x="1490" y="470" width="110" height="230"/>
  </g>
  <!-- main building -->
  <g>
    <polygon points="520,170 1010,170 1010,720 520,720" fill="url(#face)"/>
    <polygon points="1010,170 1210,230 1210,740 1010,720" fill="url(#side)"/>
    <!-- floors -->
    <g>
      <g id="floor">
        <rect x="520" y="205" width="490" height="4" fill="#fff" opacity="0.7"/>
      </g>
    </g>
    <g fill="url(#glass)">
      <rect x="548" y="222" width="105" height="78" rx="3"/><rect x="676" y="222" width="105" height="78" rx="3"/><rect x="804" y="222" width="105" height="78" rx="3"/><rect x="932" y="222" width="55" height="78" rx="3"/>
      <rect x="548" y="342" width="105" height="78" rx="3"/><rect x="676" y="342" width="105" height="78" rx="3"/><rect x="804" y="342" width="105" height="78" rx="3"/><rect x="932" y="342" width="55" height="78" rx="3"/>
      <rect x="548" y="462" width="105" height="78" rx="3"/><rect x="676" y="462" width="105" height="78" rx="3"/><rect x="804" y="462" width="105" height="78" rx="3"/><rect x="932" y="462" width="55" height="78" rx="3"/>
      <rect x="548" y="582" width="105" height="78" rx="3"/><rect x="676" y="582" width="105" height="78" rx="3"/><rect x="804" y="582" width="105" height="78" rx="3"/><rect x="932" y="582" width="55" height="78" rx="3"/>
    </g>
    <!-- balconies -->
    <g fill="#ffffff">
      <rect x="520" y="300" width="500" height="14" rx="2"/>
      <rect x="520" y="420" width="500" height="14" rx="2"/>
      <rect x="520" y="540" width="500" height="14" rx="2"/>
      <rect x="520" y="660" width="500" height="14" rx="2"/>
      <rect x="500" y="170" width="520" height="14" rx="2"/>
    </g>
    <g fill="#123b43" opacity="0.14">
      <rect x="520" y="314" width="500" height="10"/>
      <rect x="520" y="434" width="500" height="10"/>
      <rect x="520" y="554" width="500" height="10"/>
      <rect x="520" y="674" width="500" height="10"/>
    </g>
    <!-- gold accent line -->
    <rect x="520" y="184" width="490" height="3" fill="#c4a66a"/>
    <!-- side windows -->
    <g fill="#143f48" opacity="0.6">
      <polygon points="1040,250 1180,292 1180,330 1040,300"/>
      <polygon points="1040,360 1180,402 1180,440 1040,410"/>
      <polygon points="1040,470 1180,512 1180,550 1040,520"/>
      <polygon points="1040,580 1180,622 1180,660 1040,630"/>
    </g>
    <!-- lobby -->
    <rect x="720" y="684" width="150" height="36" fill="url(#glass)"/>
  </g>
  <!-- ground -->
  <rect x="0" y="720" width="1600" height="180" fill="#dcd7c8"/>
  <rect x="0" y="720" width="1600" height="6" fill="#c3bba8"/>
  <path d="M0 800 H1600" stroke="#fff" stroke-opacity="0.5" stroke-width="3" stroke-dasharray="40 30"/>
  <!-- trees -->
  <g>
    <rect x="378" y="660" width="8" height="66" fill="#6b5a44"/>
    <ellipse cx="382" cy="640" rx="46" ry="52" fill="#4c7a60"/>
    <rect x="1262" y="670" width="8" height="56" fill="#6b5a44"/>
    <ellipse cx="1266" cy="650" rx="40" ry="46" fill="#4c7a60"/>
    <ellipse cx="470" cy="728" rx="40" ry="16" fill="#5b8a6e"/>
    <ellipse cx="1120" cy="732" rx="46" ry="16" fill="#5b8a6e"/>
  </g>
</svg>
